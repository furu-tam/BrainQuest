<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>BrainQuest — Logic</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="app-shell">
      <a href="memory.html" class="back-link">←</a>
      <main class="screen">
        <p class="game-title">Suy luận logic</p>
        <p class="game-step">Câu 1 / 1</p>

        <div class="logic-chain">
          🐘 &gt; 🐶<br />
          🐶 &gt; 🐥
        </div>

        <p class="logic-question">Ai là con lớn nhất?</p>
        <div class="options-grid">
          <button type="button" class="option-btn correct" onclick="location.href='reward.html'">🐘</button>
          <button type="button" class="option-btn">🐶</button>
          <button type="button" class="option-btn">🐥</button>
        </div>
      </main>
    </div>
  </body>
</html>
