<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>BrainQuest — Ghi nhớ</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="app-shell">
      <a href="pattern.html" class="back-link">←</a>
      <main class="screen">
        <p class="game-title">Ghi nhớ hình ảnh</p>
        <p class="game-step">Câu 1 / 2 · Nhớ trong 3 giây</p>

        <div class="timer-ring">3</div>

        <div class="memory-show">
          <div class="animal">🐶</div>
          <div class="animal">🐱</div>
          <div class="animal">🐻</div>
          <div class="animal">🐰</div>
        </div>

        <p class="logic-question">Con vật nào bạn đã thấy?</p>
        <div class="options-grid">
          <button type="button" class="option-btn" onclick="location.href='logic.html'">🐶</button>
          <button type="button" class="option-btn">🦁</button>
          <button type="button" class="option-btn">🐸</button>
        </div>
      </main>
    </div>
  </body>
</html>
