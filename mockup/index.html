<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>BrainQuest — Trang chủ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="demo-label">Mockup MVP · 390px mobile-first</div>
      <main class="screen">
        <header class="header">
          <div class="logo"><span class="logo-icon">🧠</span> BrainQuest</div>
          <p class="header-sub">5 phút mỗi ngày — tiến bộ từng chút!</p>
        </header>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">Level</div>
            <div class="stat-value">5</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">XP</div>
            <div class="stat-value">120</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Coins</div>
            <div class="stat-value">75</div>
          </div>
        </div>

        <div class="streak-banner">
          <span class="emoji">🔥</span>
          <span>3 ngày liên tiếp!</span>
        </div>

        <div class="progress-daily">
          <label>
            <span>Thử thách hôm nay</span>
            <span>2/5</span>
          </label>
          <div class="progress-track">
            <div class="progress-fill" style="width: 40%"></div>
          </div>
        </div>

        <div class="modes-list">
          <div class="mode-chip pattern">
            <span class="icon">🔴🔵</span>
            <div>
              <h3>Nhận diện quy luật</h3>
              <p>2 câu hôm nay</p>
            </div>
          </div>
          <div class="mode-chip memory">
            <span class="icon">🐶🐱</span>
            <div>
              <h3>Ghi nhớ</h3>
              <p>2 câu hôm nay</p>
            </div>
          </div>
          <div class="mode-chip logic">
            <span class="icon">🐘🐶</span>
            <div>
              <h3>Suy luận logic</h3>
              <p>1 câu hôm nay</p>
            </div>
          </div>
        </div>

        <a href="pattern.html" class="cta-play">▶ PLAY TODAY</a>
      </main>

      <nav class="bottom-nav">
        <a href="index.html" class="active"><span class="nav-icon">🏠</span> Nhà</a>
        <a href="dashboard.html"><span class="nav-icon">📊</span> Tiến độ</a>
        <a href="screens.html"><span class="nav-icon">📱</span> Tất cả</a>
      </nav>
    </div>
  </body>
</html>
