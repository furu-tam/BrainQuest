<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>BrainQuest — Tiến độ</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="app-shell">
      <a href="index.html" class="back-link">←</a>
      <main class="screen dashboard">
        <header class="header">
          <div class="logo"><span class="logo-icon">📊</span> Tiến độ</div>
        </header>

        <h2>Kỹ năng</h2>
        <div class="skill-bars">
          <div class="skill-row pattern">
            <header><span>Quy luật</span><span>72%</span></header>
            <div class="bar"><span></span></div>
          </div>
          <div class="skill-row memory">
            <header><span>Ghi nhớ</span><span>58%</span></header>
            <div class="bar"><span></span></div>
          </div>
          <div class="skill-row logic">
            <header><span>Logic</span><span>65%</span></header>
            <div class="bar"><span></span></div>
          </div>
        </div>

        <h2>Tuần này</h2>
        <div class="week-chart">
          <div class="day"><div class="bar-col" style="height: 40%"></div><span class="day-label">T2</span></div>
          <div class="day"><div class="bar-col" style="height: 70%"></div><span class="day-label">T3</span></div>
          <div class="day"><div class="bar-col" style="height: 55%"></div><span class="day-label">T4</span></div>
          <div class="day"><div class="bar-col" style="height: 90%"></div><span class="day-label">T5</span></div>
          <div class="day"><div class="bar-col" style="height: 100%"></div><span class="day-label">T6</span></div>
          <div class="day"><div class="bar-col" style="height: 30%"></div><span class="day-label">T7</span></div>
          <div class="day"><div class="bar-col" style="height: 20%"></div><span class="day-label">CN</span></div>
        </div>

        <h2 style="margin-top: 24px">Thành tích</h2>
        <div class="achievements">
          <div class="achievement unlocked"><span class="badge">👣</span>First Steps</div>
          <div class="achievement unlocked"><span class="badge">🧠</span>Smart Kid</div>
          <div class="achievement"><span class="badge">🔥</span>7-Day Hero</div>
          <div class="achievement"><span class="badge">🎯</span>Memory Master</div>
        </div>
      </main>

      <nav class="bottom-nav">
        <a href="index.html"><span class="nav-icon">🏠</span> Nhà</a>
        <a href="dashboard.html" class="active"><span class="nav-icon">📊</span> Tiến độ</a>
        <a href="screens.html"><span class="nav-icon">📱</span> Tất cả</a>
      </nav>
    </div>
  </body>
</html>
