<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>BrainQuest — Quy luật</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="app-shell">
      <a href="index.html" class="back-link" aria-label="Quay lại">←</a>
      <main class="screen">
        <p class="game-title">Nhận diện quy luật</p>
        <p class="game-step">Câu 1 / 2 · Dễ</p>

        <div class="sequence-box">
          <span class="item">🔴</span>
          <span class="item">🔵</span>
          <span class="item">🔴</span>
          <span class="item">🔵</span>
          <span class="item question">?</span>
        </div>

        <p class="game-step">Chọn hình tiếp theo</p>
        <div class="options-grid">
          <button type="button" class="option-btn correct" onclick="location.href='memory.html'">🔴</button>
          <button type="button" class="option-btn">🟢</button>
          <button type="button" class="option-btn">🟡</button>
        </div>
      </main>
    </div>
  </body>
</html>
